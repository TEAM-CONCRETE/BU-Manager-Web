name: Create Issue from Jira
on:
  repository_dispatch:
    types: [jira-issue]

permissions:
  issues: write
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Convert escaped newlines and create issue body
        run: |
          # 1️⃣ Jira에서 전달된 값들을 환경변수로 받기
          desc="${{ github.event.client_payload.description }}"
          todo="${{ github.event.client_payload.todo }}"

          # 2️⃣ 이스케이프된 \n 및 \\n을 실제 줄바꿈으로 변환
          desc=$(echo "$desc" | sed -E 's/\\\\n/\n/g' | sed -E 's/\\n/\n/g')
          todo=$(echo "$todo" | sed -E 's/\\\\n/\n/g' | sed -E 's/\\n/\n/g')

          # 3️⃣ Markdown 형식의 이슈 본문 작성
          cat > issue-body.md <<EOF
          ## 🚀 Description
          > $desc

          ---

          ### ✅ To-Do List
          $(echo "$todo" | sed 's/^/- [ ] /')

          ---

          ### 👤 담당자
          ${{ github.event.client_payload.reporter }}

          ### 🔗 Jira Link
          [**${{ github.event.client_payload.key }}**](${{ github.event.client_payload.url }})
          EOF

      - name: Create issue from generated file
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "[${{ github.event.client_payload.key }}] ${{ github.event.client_payload.summary }}"
          content-filepath: ./issue-body.md
          labels: |
            jira
            ${{ github.event.client_payload.type }}
