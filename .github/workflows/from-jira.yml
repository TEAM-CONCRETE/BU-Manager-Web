name: Create Issue from Jira
on:
  repository_dispatch:
    types: [jira-issue]

permissions:
  issues: write
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Generate markdown body (Python-safe newline fix)
        run: |
          python3 <<'PYCODE'
          import base64, os

          # 가져오기
          desc = os.environ.get("DESC", "")
          todo = os.environ.get("TODO", "")

          # 이스케이프된 줄바꿈을 실제 개행으로 변환
          desc = desc.replace("\\\\n", "\n").replace("\\n", "\n")
          todo = todo.replace("\\\\n", "\n").replace("\\n", "\n")

          # Markdown 체크박스 붙이기
          todo_lines = [f"- [ ] {line.strip()}" for line in todo.splitlines() if line.strip()]
          todo_md = "\n".join(todo_lines)

          md = f"""## 🚀 Description
> {desc}

---

### ✅ To-Do List
{todo_md}

---

### 👤 담당자
{os.environ.get('REPORTER', '')}

### 🔗 Jira Link
[**{os.environ.get('KEY', '')}**]({os.environ.get('URL', '')})
"""
          with open("issue-body.md", "w", encoding="utf-8") as f:
              f.write(md)
          PYCODE
        env:
          DESC: ${{ github.event.client_payload.description }}
          TODO: ${{ github.event.client_payload.todo }}
          REPORTER: ${{ github.event.client_payload.reporter }}
          KEY: ${{ github.event.client_payload.key }}
          URL: ${{ github.event.client_payload.url }}

      - name: Create issue from generated file
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "[${{ github.event.client_payload.key }}] ${{ github.event.client_payload.summary }}"
          content-filepath: ./issue-body.md
          labels: |
            jira
            ${{ github.event.client_payload.type }}
