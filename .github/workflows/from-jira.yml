name: Create Issue from Jira
on:
  repository_dispatch:
    types: [jira-issue]

permissions:
  issues: write
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Generate issue body (bash, base64-safe)
        run: |
          # 1) Base64로 받은 설명/투두 복원
          DESC_B64='${{ github.event.client_payload.description }}'
          TODO_B64='${{ github.event.client_payload.todo }}'

          desc="$(printf '%s' "$DESC_B64" | base64 --decode || true)"
          todo="$(printf '%s' "$TODO_B64" | base64 --decode || true)"

          # 2) Markdown 본문 조립 (여기서 줄 단위로 가공)
          {
            echo "## 🚀 Description"
            # 인용문 형태로 줄마다 출력
            if [ -n "$desc" ]; then
              printf '%s' "$desc" | while IFS= read -r line; do
                # 빈 줄도 인용 유지
                [ -n "$line" ] && echo "> $line" || echo ">"
              done
            fi

            echo ""
            echo "---"
            echo "### ✅ To-Do List"
            if [ -n "$todo" ]; then
              # 각 줄을 체크박스로 변환
              printf '%s' "$todo" | while IFS= read -r line; do
                [ -n "$line" ] && echo "- [ ] $line"
              done
            fi

            echo ""
            echo "---"
            echo "### 👤 담당자"
            echo "${{ github.event.client_payload.reporter }}"
            echo ""
            echo "### 🔗 Jira Link"
            echo "[**${{ github.event.client_payload.key }}**](${{ github.event.client_payload.url }})"
          } > issue-body.md

      - name: Create issue from generated file
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "[${{ github.event.client_payload.key }}] ${{ github.event.client_payload.summary }}"
          content-filepath: ./issue-body.md
          labels: |
            jira
            ${{ github.event.client_payload.type }}
